services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: factorypulse-mcp-server:latest
    container_name: factorypulse-mcp-server
    ports:
      - "${MCP_PORT:-8766}:8766"
    environment:
      - MCP_TRANSPORT=${MCP_TRANSPORT:-streamable-http}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8766
      - PYTHONUNBUFFERED=1
      - FACTORYPULSE_CHROMA_PATH=/data/chromadb
    volumes:
      # Montage des fixtures et de la configuration en lecture seule :
      # permet de modifier ou enrichir les données du labo sans rebuilder l'image
      - ./config:/app/config:ro
      - ./data/fixtures:/app/data/fixtures:ro
      # Volume persistant pour la base vectorielle ChromaDB
      - chroma-data:/data/chromadb
      # Montage de la documentation technique pour ré-indexation dynamique
      - ./docs:/app/docs:ro
      - ./materials:/app/materials:ro
    restart: unless-stopped

volumes:
  chroma-data:
    driver: local

